<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 76 596 248" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <!-- A sketch of the gate, not a recording: a card taps the reader, the light turns
       green, the gate radios the scan, and a new entry slides into the log. 6 s loop.
       Base styles are the end state, so reduced motion shows the finished scene. -->
  <style>
    .card { transform: translateX(110px); animation: card 6s infinite; }
    .led { fill: #30D158; animation: led 6s infinite; }
    .arc { fill: none; stroke: #F5F5F7; stroke-width: 3; stroke-linecap: round; opacity: .9; animation: arc 6s infinite; }
    .a2 { animation-delay: .2s; } .a3 { animation-delay: .4s; }
    .old { transform: translateY(42px); animation: old 6s infinite; }
    .new { animation: new 6s infinite; }
    @keyframes card { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; }
      22%, 58% { transform: translateX(110px); opacity: 1; animation-timing-function: ease-in; }
      66%, 100% { transform: translateX(110px); opacity: 0; } }
    @keyframes led { 0%, 21% { fill: #48484A; } 23%, 62% { fill: #30D158; } 66%, 100% { fill: #48484A; } }
    @keyframes arc { 0%, 25% { opacity: 0; } 29% { opacity: .9; } 37%, 100% { opacity: 0; } }
    @keyframes old { 0%, 40% { transform: translateY(0); } 47%, 90% { transform: translateY(42px); }
      97%, 100% { transform: translateY(0); } }
    @keyframes new { 0%, 42% { opacity: 0; transform: translateX(-10px); } 49%, 88% { opacity: 1; transform: none; }
      94%, 100% { opacity: 0; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- the card -->
  <g class="card">
    <rect x="40" y="166" width="120" height="78" rx="10" fill="#F5F5F7"/>
    <rect x="56" y="182" width="24" height="18" rx="4" fill="#C7C7CC"/>
    <rect x="56" y="222" width="64" height="6" rx="3" fill="#C7C7CC"/>
  </g>

  <!-- the reader on its post -->
  <rect x="238" y="118" width="72" height="164" rx="16" fill="#2C2C2E" stroke="#48484A" stroke-width="1.5"/>
  <circle class="led" cx="274" cy="142" r="5"/>
  <g fill="none" stroke="#8E8E93" stroke-width="2.5" stroke-linecap="round">
    <path d="M266 188a14 14 0 0 1 0 24"/><path d="M274 180a26 26 0 0 1 0 40"/><path d="M282 172a38 38 0 0 1 0 56"/>
  </g>

  <!-- the scan, sent by radio -->
  <path class="arc"    d="M326 182a26 26 0 0 1 0 36"/>
  <path class="arc a2" d="M338 170a44 44 0 0 1 0 60"/>
  <path class="arc a3" d="M350 158a62 62 0 0 1 0 84"/>

  <!-- the gate log -->
  <rect x="390" y="88" width="214" height="224" rx="18" fill="#2C2C2E"/>
  <text x="408" y="116" font-size="13" font-weight="600" fill="#86868B">Gate log</text>
  <g class="old" font-size="13" fill="#86868B">
    <rect x="402" y="130" width="190" height="34" rx="9" fill="#3A3A3C"/>
    <circle cx="420" cy="147" r="4" fill="#636366"/><text x="432" y="151.5">Out · 09:31</text>
    <rect x="402" y="172" width="190" height="34" rx="9" fill="#3A3A3C"/>
    <circle cx="420" cy="189" r="4" fill="#636366"/><text x="432" y="193.5">In · 09:18</text>
    <rect x="402" y="214" width="190" height="34" rx="9" fill="#3A3A3C"/>
    <circle cx="420" cy="231" r="4" fill="#636366"/><text x="432" y="235.5">In · 09:05</text>
  </g>
  <g class="new" font-size="13" font-weight="600" fill="#F5F5F7">
    <rect x="402" y="130" width="190" height="34" rx="9" fill="#48484A"/>
    <circle cx="420" cy="147" r="4" fill="#30D158"/><text x="432" y="151.5">In · 09:42</text>
  </g>
</svg>
